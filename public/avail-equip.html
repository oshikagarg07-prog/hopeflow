<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avail Equipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function doShowPic1Prev(fileCtrl, pic1prev) {
            const file = fileCtrl.files[0];
            if (file) {
                pic1prev.src = URL.createObjectURL(file);
            }
        }

        function doShowPic2Prev(fileCtrl, pic2prev) {
            const file2 = fileCtrl.files[0];
            if (file2) {
                pic2prev.src = URL.createObjectURL(file2);
            }
        }

    </script>

    <script>
        function setemail() {
            document.getElementById("txtEmail").value = localStorage.getItem("activeuser");
            document.getElementById("txtEmail").readOnly = true;
        }
    </script>
    <script>
        function logout() {
            localStorage.removeItem("activeuser");
            location.href = "index.html"
        }
    </script>

</head>

<body onload="setemail();">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/pics/logo.png" alt="Hopeflow Logo" height="40" style="margin-right: 8px; border-radius: 50%; ">
                Hopeflow
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="navbar-nav ms-auto" style="font-size: 20px;">
                    <button class="btn btn-primary" onclick="logout()" id="logout">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <center>
        <h4>AVAIL EQUIPMENT DETAILS</h4>
    </center>
    <hr>
    <div class="d-flex justify-content-center">
        <form class="row g-3 col-7" action="avail-equip" enctype="multipart/form-data" method="post">
            <div class="col-md-12">
                <label for="txtEmail" class="form-label">Email Id</label>
                <input type="email" class="form-control" name="txtEmail" id="txtEmail">
            </div>
            <div class="col-md-6">
                <label for="txtType" class="form-label">Med Equipment Type</label>
                <input type="text" class="form-control" name="txtType" id="txtType">
            </div>
            <div class="col-md-6">
                <label for="selCond" class="form-label">Condition</label>
                <div>
                    <select class="form-select" name="selCond" id="selCond" aria-label="Default select example">
                        <option selected>Select</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="ok-ok">ok-ok</option>
                        <option value="Broken">Broken</option>
                    </select>
                </div>
            </div>

            <fieldset class="row mb-3">
                <legend class="col-form-label col-sm-2 pt-0">As you Wish</legend>
                <div class="col-sm-10">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radio" id="donaterad" value="Donation"
                            checked>
                        <label class="form-check-label" for="donaterad">
                            Donation
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radio" id="salerad" value="Sale">
                        <label class="form-check-label" for="salerad">
                            For Sale
                        </label>
                    </div>
                </div>
            </fieldset>
            <div class="col-md-6">
                <p>Upload Pic1:
                    <input type="file" name="pic1" onchange="doShowPic1Prev(this,pic1prev)" required>
                    <br>
                    <img src="" id="pic1prev" alt="" width="100" height="100">
                </p>
            </div>
            <div class="col-md-6">
                <p>Upload Pic2:
                    <input type="file" name="pic2" onchange="doShowPic2Prev(this,Pprev)">
                    <br>
                    <img src="" id="pic2prev" alt="" width="100" height="100">
                </p>
            </div>
            <div class="col-md-12">
                <label for="txtInfo" class="form-label">Other Information</label>
                <input type="text" class="form-control" name="txtInfo" id="txtInfo">
            </div>
            <div class="col-12">
                <center><button type="submit" class="btn btn-primary" formaction="/avail-equip-submit-btn">Avail for the
                    Needy</button></center>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
