<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("moduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http){
            $scope.cityArray=[];
            $scope.ngoArray=[];

            //------------Fetch Cities---------------
            $scope.doFetchCity= function()
            {
                $http.get("/fetch-ngo-city").then(function(resp){
                    $scope.cityArray= resp.data;
                },function(err){
                    alert(err.data);
                });
            }

            $scope.doSearch = function()
            {
                let url="/find-ngo?city=" + $scope.city;
                $http.get(url).then(function(resp){
                    $scope.ngoArray= resp.data;
                },function(err){
                    alert(err.data);
                })
            }
        })
    </script>
    <script>
        function logout() {
            alert("Are You Sure?");
            localStorage.removeItem("activeuser");
            location.href = "index.html"
        }
    </script>
</head>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doFetchCity();">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="navbar-nav ms-auto" style="font-size: 20px;">
                    <button class="btn btn-primary" onclick="logout()" id="logout">Logout</button>
                </div>
            </div>
        </div>
    </nav> 
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h3>NGO Finder</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-5">
                        <label>City:</label>
                        <input type="text" class="form-control" list="cityList" ng-model="city">
                        <datalist id="cityList">
                            <option ng-repeat="obj in cityArray" value="{{obj.city}}"></option>
                        </datalist>
                    </div>
                    <div class="col-md-3 mt-4">
                        <button class="btn btn-primary w-100" ng-click="doSearch();">
                            Find and Show NGOs
                        </button>
                    </div>
                </div>
                <hr>
                <table class="table table-bordered table-striped">
                    <tr class="table-primary">
                        <th>S.No.</th>
                        <th>NGO Name</th>
                        <th>Reg Office</th>
                        <th>City</th>
                        <th>Website</th>
                        <th>Contact</th>
                        <th>Since</th>
                        <th>Chair Person</th>
                        <th>Works</th>
                        <th>Reg No.</th>
                    </tr>
                    <tr ng-repeat="obj in ngoArray">
                        <td>{{$index+1}}</td>
                        <td>{{obj.ngo}}</td>
                        <td>{{obj.regoffice}}</td>
                        <td>{{obj.city}}</td>
                        <td>{{obj.website}}</td>
                        <td>{{obj.contactno}}</td>
                        <td>{{obj.since}}</td>
                        <td>{{obj.chairperson}}</td>
                        <td>{{obj.ngoworks}}</td>
                        <td>{{obj.regnumber}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
