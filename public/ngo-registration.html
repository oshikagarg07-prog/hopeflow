<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <script>
    function setemail() {
      document.getElementById("txtEmail").value = localStorage.getItem("activeuser");
      document.getElementById("txtEmail").readOnly = true;
    }
  </script>

  <script>
    function logout() {
      alert("Are You Sure?");
      localStorage.removeItem("activeuser");
      location.href = "index.html"
    }
  </script>
</head>

<body onload="setemail();">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <div class="navbar-nav ms-auto" style="font-size: 20px;">
          <button class="btn btn-primary" onclick="logout()" id="logout">Logout</button>
        </div>
      </div>
    </div>
  </nav>
  <h2>
    <center>NGO-REGISTRATION</center>
  </h2>
  <div class="d-flex justify-content-center">
    <form class="row g-3 col-8" action="/ngo-registration" enctype="multipart/form-data" method="post">
      <div class="row mt-5">
        <!-- Left side -->
        <div class="col-md-4 text-center">
          <p><label>Upload Medicine Image:</label>
            <input type="file" name="medPic" onchange="doShowPrev(this,Medprev)" required>
            <br>
            <img src="" id="Medprev" alt="" width="100" height="100">
          </p>
        </div>
        <div class="col-md-8">
          <div class="col-md-12">
            <label for="txtEmail" class="form-label">Email</label>
            <input type="email" class="form-control" name="txtEmail" id="txtEmail">
          </div>
          <div class="row">
            <div class="col-md-4">
              <label for="txtName" class="form-label">NGO Name</label>
              <input type="text" class="form-control" name="txtName" id="txtName">
            </div>
            <div class="col-md-4">
              <label for="txtOffice" class="form-label">Reg. Office</label>
              <input type="text" class="form-control" name="txtOffice" id="txtOffice">
            </div>
            <div class="col-md-4">
              <label for="txtCity" class="form-label">City</label>
              <input type="text" class="form-control" name="txtCity" id="txtCity">
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <label for="txtWeb" class="form-label">Website</label>
              <input type="text" class="form-control" name="txtWeb" id="txtWeb">
            </div>
            <div class="col-md-4">
              <label for="txtContact" class="form-label">Contact No.</label>
              <input type="text" class="form-control" name="txtContact" id="txtContact">
            </div>
            <div class="col-md-4">
              <label for="txtSince" class="form-label">Since</label>
              <input type="text" class="form-control" name="txtSince" id="txtSince">
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <label for="txtPerson" class="form-label">Chairperson</label>
              <input type="text" class="form-control" name="txtPerson" id="txtPerson">
            </div>
            <div class="col-md-8">
              <label for="txtProfile" class="form-label">NGO Profile</label>
              <input type="text" class="form-control" name="txtProfile" id="txtProfile">
            </div>
          </div>
          <div class="col-md-4">
            <label for="txtReg" class="form-label">Registration No.</label>
            <input type="text" class="form-control" name="txtReg" id="txtReg">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary" formaction="/ngo-register-btn">Register Now</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
