<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donor Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>
        function logout() {
            alert("Are you Sure?");
            localStorage.removeItem("activeuser");
            location.href = "index.html"
        }
    </script>

    <script>
        function doShowAdharPrev(fileCtrl, Aprev) {
            const file = fileCtrl.files[0];
            if (file) {
                Aprev.src = URL.createObjectURL(file);
            }
        }

        function doShowProfilePrev(fileCtrl, Pprev) {
            const file2 = fileCtrl.files[0];
            if (file2) {
                Pprev.src = URL.createObjectURL(file2);
            }
        }

        $(document).ready(function () {
            $("#btnGetData").click(function () {
                let obj = {
                    url: "/get-data",
                    data: {
                        emailKuch: $("#txtEmail").val()
                    }
                }
                $.ajax(obj).then(function (jsonAry) {
                    alert(JSON.stringify(jsonAry));
                    $("#txtFName").val(jsonAry[0].fname);
                    $("#txtLName").val(jsonAry[0].lname);
                    $("#txtMobile").val(jsonAry[0].mobile);
                    $("#txtAddress").val(jsonAry[0].address);
                    $("#txtCity").val(jsonAry[0].city);
                    $("#Aprev").prop("src", jsonAry[0].acardpath);
                    $("#Pprev").prop("src", jsonAry[0].picpath);
                }).fail(function (err) {
                    alert(err);
                })
            })
        })

    </script>

    <script>
        function setemail() {
            document.getElementById("txtEmail").value = localStorage.getItem("activeuser");
            document.getElementById("txtEmail").readOnly = true;
        }
    </script>
</head>

<body onload="setemail();">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/pics/logo.png" alt="Hopeflow Logo" height="40" style="margin-right: 8px; border-radius: 50%; ">
                Hopeflow
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <div class="navbar-nav ms-auto" style="font-size: 20px;">
                    <button class="btn btn-primary" onclick="logout()" id="logout">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <center>
        <h4>DONOR PROFILE</h4>
    </center>
    <hr>

    <div class="d-flex justify-content-center">
        <form class="row g-3 col-md-8" action="/donor-submit" enctype="multipart/form-data" method="post">
            <div class="row mt-2">
                <div class="col-md-6">
                    <label for="txtFName" class="form-label">First Name</label>
                    <input type="text" class="form-control" name="txtFName" id="txtFName" required>
                </div>
                <div class="col-md-6">
                    <label for="txtLName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" name="txtLName" id="txtLName">
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-md-8">
                    <label for="txtEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="txtEmail" id="txtEmail">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="button" class="btn btn-danger" id="btnGetData" value="Get Profile Data">Get Profile
                        Data</button>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-6">
                    <label for="txtMobile" class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" name="txtMobile" id="txtMobile" required>
                </div>
                <div class="col-md-4">
                    <label for="txtPin" class="form-label">Pincode</label>
                    <input type="text" class="form-control" name="txtPin" id="txtPin" required>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-md-8">
                    <label for="txtAddress" class="form-label">Residential Address</label>
                    <input type="text" class="form-control" id="txtAddress" name="txtAddress" required>
                </div>
                <div class="col-md-4">
                    <label for="txtCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="txtCity" name="txtCity" required>
                </div>
            </div>
            <div class="col-md-4">
                <p>Upload Aadhar Card:
                    <input type="file" name="acardPic" onchange="doShowAdharPrev(this,Aprev)" required>
                    <br>
                    <img src="" id="Aprev" alt="" width="150" height="100">
                </p>
            </div>
            <div class="col-md-4">
                <p>Upload Profile Pic:
                    <input type="file" name="profilePic" onchange="doShowProfilePrev(this,Pprev)" required>
                    <br>
                    <img src="" id="Pprev" alt="" width="150" height="100">
                </p>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        Confirm Submit
                    </label>
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-danger" formaction="/donor-submit">Submit</button>
                <button type="submit" class="btn btn-danger" formaction="/donor-profile-update">Modify
                    Profile</button>
            </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
