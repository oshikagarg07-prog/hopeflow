<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule=angular.module("moduleKuch",[]);
        let mycontroller=myModule.controller("controllerKuch",function($scope,$http)
        {
            $scope.doShowAll=function()
            {
                let url="/fetch-userdata";
                $http.get(url).then(function(resp)
                {
                    //alert(JSON.stringify(resp.data))
                    $scope.jsonArray=resp.data;
                },function(err){
                    alert(err);
                });
            }
            //-----------------------------------------------------
             $scope.doDelete=function(emailidKuch)
             {
                alert(emailidKuch);
                let url="/do-delete?emailKeyKuch="+emailidKuch;
                $http.get(url).then(function(resp){
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                },function(err){
                    alert(err);
                })
             }
            //------------------------------------------------------
            $scope.doBlock=function(emailidKuch)
            {
                alert(emailidKuch);
                let url="/block-user?emailKeyKuch="+emailidKuch;
                $http.get(url).then(function(resp){
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                },function(err){
                    alert(err);
                })
            }
            //-----------------------------------------------------
            $scope.doResume=function(emailidKuch)
            {
                alert(emailidKuch);
                let url="/resume-user?emailKeyKuch="+emailidKuch;
                $http.get(url).then(function(resp){
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();
                },function(err){
                    alert(err);
                })
            }
        })
    </script>
  </head>
  <body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowAll();">
    <center>
        <table width="1000" border="1">
            <tr>
                <th>Sr.No.</th><th>Email Id</th><th>Password</th><th>User Type</th><th>Date of Signup</th><th>Status</th><th>Operations</th>
            </tr>
            <tr ng-repeat="obj in jsonArray">
                <td>{{$index+1}}</td>
                <td>{{obj.emailid}}</td>
                <td>{{obj.pwd}}</td>
                <td>{{obj.utype}}</td>
                <td>{{obj.dos}}</td>
                <td align="center">
                    <a href="#" class="btn btn-outline-danger me-2" ng-if="obj.statas==1" ng-click="doBlock(obj.emailid);">Block</a>
                    <a href="#" class="btn btn-outline-success me-2" ng-if="obj.statas==0" ng-click="doResume(obj.emailid);">Resume</a>
                </td>
                <td align="center">
                    <a href="#" class="btn btn-outline-primary me-2" ng-click="doDelete(obj.emailid);">Delete</a>
                </td>
            </tr>
        </table>
    </center>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
