<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("moduleKuch", []);
        let mycontroller = myModule.controller("controllerKuch", function ($scope, $http) {
            $scope.doShowAll = function () {
                let url = "/fetch-ngodata";
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data))
                    $scope.jsonArray = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
        })
    </script>
</head>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowAll();">
    <center>
        <table class="table table-bordered table-striped">
            <tr class="table-primary">
                <th>S.No.</th>
                <th>NGO Name</th>
                <th>Reg Office</th>
                <th>City</th>
                <th>Website</th>
                <th>Contact</th>
                <th>Since</th>
                <th>Chair Person</th>
                <th>Works</th>
                <th>Reg No.</th>
                </tr>
            <tr ng-repeat="obj in jsonArray">
                <td>{{$index+1}}</td>
                <td>{{obj.ngo}}</td>
                <td>{{obj.regoffice}}</td>
                <td>{{obj.city}}</td>
                <td>{{obj.website}}</td>
                <td>{{obj.contactno}}</td>
                <td>{{obj.since}}</td>
                <td>{{obj.chairperson}}</td>
                <td>{{obj.ngoworks}}</td>
                <td>{{obj.regnumber}}</td>
            </tr>
        </table>
    </center>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
